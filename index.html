<!doctype html>
<html lang="en">

    />
    <meta name="theme-color" content="#EEF1F4" />
    <title>Ishak Sacirbey — designer &amp; developer</title>
    <script>
      /* Lay the page out at 1440px and scale it to the window, so laptops and big monitors show the same design.
         Below 1280px the normal responsive layout takes over. Height-based units divide by --z to undo the zoom. */
      (function () {
        var fit = function () {
          // Browser zoom (Cmd +/−) shrinks innerWidth but not outerWidth; measure the window without it so that zoom still works.
          var user = outerWidth ? Math.round((outerWidth / innerWidth) * 20) / 20 : 1;
          var w = innerWidth * user,
            z = w >= 1280 ? w / 1440 : 1,
            s = document.documentElement.style;
          s.zoom = z === 1 ? "" : String(z);
          s.setProperty("--z", String(z));
        };
        fit();
        addEventListener("resize", fit);
      })();
    </script>
    <link rel="preload" href="/fonts/Jersey10-Regular.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
